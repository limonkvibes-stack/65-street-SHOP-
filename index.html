<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>65 Street Shop | Собрать образ</title>

<style>

:root {
  --cream: #D8C7AA;
  --cream-light: #E8DCC7;
  --brown: #493229;
  --brown-dark: #2A1C17;
  --brown-deep: #19110F;
  --black: #0E0D0C;
  --white: #F8F4EC;
  --gold: #B89555;
  --gold-light: #D5B76F;
  --muted: #AFA092;
  --border: rgba(184,149,85,0.55);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  color: var(--white);
  font-family: "Segoe UI", Roboto, Arial, sans-serif;

  background:
    linear-gradient(
      135deg,
      #D8C7AA 0%,
      #B79D7C 30%,
      #6A4A3A 65%,
      #2A1C17 100%
    );

  background-attachment: fixed;
}

/* HEADER */

header {
  position: sticky;
  top: 0;
  z-index: 1000;

  background: rgba(25,17,15,0.94);

  backdrop-filter: blur(14px);

  border-bottom: 1px solid var(--border);
}

.nav-container {
  max-width: 1200px;
  margin: auto;
  min-height: 70px;
  padding: 15px 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  color: var(--white);
  font-size: 23px;
  font-weight: 800;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.logo span {
  color: var(--gold-light);
}

.back-link {
  color: var(--white);
  text-decoration: none;

  font-size: 12px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;

  transition: 0.3s;
}

.back-link:hover {
  color: var(--gold-light);
}

/* MAIN */

.container {
  width: min(1200px, 100%);
  margin: auto;
  padding: 65px 20px;
}

.title {
  text-align: center;
  color: var(--white);

  font-size: clamp(30px, 5vw, 48px);
  font-weight: 900;
  letter-spacing: 5px;
}

.subtitle {
  text-align: center;
  color: var(--cream-light);

  font-size: 15px;
  line-height: 1.6;
  margin-top: 12px;
}

.gold-line {
  width: 70px;
  height: 2px;

  background: var(--gold);

  margin: 25px auto 35px;
}

/* CATALOG */

.look-box {
  background: rgba(25,17,15,0.94);

  border: 1px solid var(--border);
  border-radius: 4px;

  padding: 20px;

  box-shadow:
    0 25px 60px rgba(0,0,0,0.35);
}

/* 40 PHOTOS */

.look-grid {
  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 18px;
}

.look-item {
  position: relative;
  overflow: hidden;

  background: var(--black);

  border:
    1px solid
    rgba(184,149,85,0.45);

  border-radius: 4px;

  padding: 7px;

  transition: 0.3s ease;
}

.look-item:hover {
  transform: translateY(-5px);

  border-color:
    var(--gold-light);

  box-shadow:
    0 15px 35px
    rgba(0,0,0,0.35);
}

.look-item img {
  display: block;

  width: 100%;
  height: 360px;

  object-fit: cover;

  border-radius: 2px;

  background: #30221D;

  transition:
    transform 0.4s ease;
}

.look-item:hover img {
  transform: scale(1.025);
}

/* NUMBER */

.look-number {
  position: absolute;

  top: 16px;
  left: 16px;

  width: 32px;
  height: 32px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: var(--white);

  background:
    rgba(25,17,15,0.9);

  border:
    1px solid var(--gold);

  border-radius: 50%;

  font-size: 12px;
  font-weight: 800;

  z-index: 2;
}

/* CONTROLS */

.controls {
  display: flex;

  justify-content: center;
  align-items: center;

  gap: 15px;

  margin-top: 30px;
}

.control-button {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  min-height: 52px;

  padding: 15px 25px;

  border: 1px solid var(--gold);
  border-radius: 4px;

  background:
    linear-gradient(
      135deg,
      #493229,
      #241713
    );

  color: var(--white);

  text-decoration: none;

  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.5px;

  cursor: pointer;

  transition: 0.3s ease;
}

.control-button:hover {
  color: var(--gold-light);

  border-color:
    var(--gold-light);

  transform:
    translateY(-3px);

  box-shadow:
    0 15px 30px
    rgba(0,0,0,0.3);
}

/* TABLET */

@media (max-width: 900px) {.look-grid {
    grid-template-columns:
      repeat(3, 1fr);
  }

  .look-item img {
    height: 330px;
  }

}

/* MOBILE */

@media (max-width: 700px) {

  .nav-container {
    min-height: auto;
    padding: 15px;
  }

  .logo {
    font-size: 18px;
    letter-spacing: 2px;
  }

  .back-link {
    font-size: 9px;
    letter-spacing: 1px;
  }

  .container {
    padding: 40px 12px;
  }

  .title {
    font-size: 28px;
    letter-spacing: 3px;
  }

  .subtitle {
    font-size: 13px;
  }

  .look-box {
    padding: 10px;
  }

  .look-grid {
    grid-template-columns:
      repeat(2, 1fr);

    gap: 9px;
  }

  .look-item {
    padding: 5px;
  }

  .look-item img {
    height: 270px;
  }

  .look-number {
    top: 12px;
    left: 12px;

    width: 28px;
    height: 28px;
  }

  .controls {
    flex-direction: column;
    gap: 10px;
  }

  .control-button {
    width: 100%;
  }

}

@media (max-width: 420px) {

  .look-grid {
    gap: 7px;
  }

  .look-item img {
    height: 230px;
  }

}

</style>

</head>
